# Phase 0 / P0-D — 冷启动数据来源消融：偏 27B ("27B 为主"假设, 70:30)
# 见 doc/Plan_冷启动数据来源消融.md
# 本臂 buffer 由: warmup_buffer.py --ratio-27b 0.7 生成。
defaults:
  - ../base

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0

cl:
  lambda_replay: 0.5
  buffer:
    enabled: true
    num_buckets: 9
    warmup_path: data/mock/buffer_dumps/p0-d_mix7030.sqlite   # 70% 27B : 30% gpt5
  weighting:
    scheme: W0

trainer:
  experiment_name: p0-d-src-mix7030
  total_training_steps: 30
