# Phase 3 / R0 — CLEAR baseline (单 buffer + reservoir + 均匀)
# 继承 configs/base.yaml
# 对照轴：桶结构 vs CLEAR (R0 → R3)

defaults:
  - ../base

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0            # lambda_2 = 0

cl:
  lambda_replay: 0.5             # lambda_3 = 0.5
  replay_batch_size: 32
  buffer:
    enabled: true
    num_buckets: 1               # 单 buffer，无桶结构（名/数自动塌缩为 "All"）
    total_capacity: 10000        # CLEAR 原论文 10k
    q_min: 10000
    eviction_type: reservoir     # CLEAR：随机丢弃（reservoir sampling）
    within_bucket_sampling: uniform  # 全 buffer 均匀采样
    priority_type: uniform       # CLEAR 不用 priority
  weighting:
    scheme: W2                   # gamma=delta=1 即均权（见 base.yaml 说明）
    gamma: 1.0
    delta: 1.0
