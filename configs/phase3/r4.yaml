# Phase 3 / R4 — BucketDesign 完整版 (两级采样 + 抗遗忘 priority)
# 继承 configs/base.yaml
# 对照轴：是否使用 priority (R3 → R4), priority 类型 (R4 → R5)

defaults:
  - ../base

actor:
  use_kl_loss: false
  kl_loss_coef: 0.0

cl:
  lambda_replay: 0.5
  buffer:
    enabled: true
    num_buckets: 7
    total_capacity: 25000
    q_min: 2000
  weighting:
    scheme: W0                   # 采样用 priority，但 token 权重均匀
