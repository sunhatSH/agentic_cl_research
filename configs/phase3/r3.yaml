# Phase 3 / R3 — BucketDesign 基础版 (两级采样，无 priority)
# 继承 configs/base.yaml
# 对照轴：桶结构 vs CLEAR (R0 → R3), 是否使用 priority (R3 → R4)

defaults:
  - ../base

actor:
  use_kl_loss: false
  kl_loss_coef: 0.0

cl:
  lambda_replay: 0.5
  buffer:
    enabled: true
    num_buckets: 7
    total_capacity: 25000
    q_min: 2000
  weighting:
    scheme: W0                   # 桶内均匀，无 priority 加权
