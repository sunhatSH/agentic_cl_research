# Agent 模型选型配置 — 单一信源
#
# 代码（agents/clients, agents/config.py, trainer/model_reward.py）+ 测试 + 启动脚本统一读取本文件。
#
# API key 不写进本文件，从 .env 或环境变量读取（key_env 指示对应的 env var）。
# 所有模型共用同一个 tokenhub key：TOKENHUB_API_KEY（endpoint tokenhub.sensetime.com/v1）。
# 2026-08-17：从 sufy（openai.sufy.com）整体迁到 tokenhub —— tokenhub 现已能直连沙箱，
# 统一走 tokenhub 一个入口。tokenhub 模型 id 不带 provider 前缀（sufy 的 openai//qwen//
# deepseek/ 前缀去掉即得；迁移前逐个探活确认可调用）。
#
# ── 两层容错结构（2026-07-08）──────────────────────────────────────────
# 每个角色配一个 providers 列表 = 两层循环容错的候选池：
#   外层：providers（厂商）——第一个厂商全挂才切下一个厂商
#   内层：每个 provider 的 models（同厂商模型）——某模型 502/401/超时→切同厂商下一个
# FailoverChatClient 发现某模型不可用时自动顺延，并记住首个可用的当默认
# （current provider/model 存内存；传 state_path 可落盘，跨并发短命进程复用）。
# 抗坍缩轮换（questioner 的 rotate_every）与容错正交：在**可用**模型间主动轮换。
#
# 向后兼容：旧的 observer.api_base / questioner.rotation 结构仍可解析。

observer:
  temperature: 0.0                   # 客观取证，确定性
  providers:
    - name: tokenhub
      api_base: "https://tokenhub.sensetime.com/v1"
      key_env: "TOKENHUB_API_KEY"
      models:
        - "gpt-5.4-mini"             # 轻量取证角色，采集量最大→选省的
        - "gpt-5-mini"               # 同厂商备用

questioner:
  temperature: 0.9                   # 抗坍缩
  rotate_every: 5                    # 每 5 次提问主动轮换（在可用模型间）
  providers:
    - name: tokenhub                 # 主厂商：3 个可靠非 thinking 模型
      api_base: "https://tokenhub.sensetime.com/v1"
      key_env: "TOKENHUB_API_KEY"
      # 顺序 = failover 优先级。全部为**非 thinking** 可靠模型——2026-07-10 iter9
      # 实测 thinking 模型（deepseek-v4-pro/kimi-k2.6）在加长 prompt 下截断激增
      # （kimi 15 次 + deepseek 7 次 / 一批 32 query），且 questioner 不做截断退避
      # （退避只给 reward judge），一轮内多模型连环截断 → AllEndpointsFailed →
      # questioner_error。questioner 的活（读报告 + 人设口吻问一句）不需要深推理，
      # 故彻底移除两个 thinking 模型；跨风格多样性靠 sonnet/qwen/gpt-mini 三家 +
      # rotate_every 轮换 + 人设 + 每轮报告变化保证，不依赖 thinking 模型。
      models:
        - "qwen3.7-max"
        - "qwen3.6-plus"
        - "gpt-5.4-mini"

reward:
  temperature: 0.0                   # 冻结 reward，一致性
  providers:
    - name: tokenhub
      api_base: "https://tokenhub.sensetime.com/v1"
      key_env: "TOKENHUB_API_KEY"
      models:
        - "gpt-5.6-luna"  # 主 judge(2026-08-06 切换:扣分prompt下 reward 0.607 vs gemini 0.889,分布更均匀)
        - "bailian/deepseek-v4-flash-0731"  # 备用（tokenhub 上的 deepseek-v4-flash 0731 版）
