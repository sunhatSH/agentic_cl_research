# Agent 模型选型配置 — 单一信源
#
# 代码（agents/clients, agents/config.py, trainer/model_reward.py）+ 测试 + 启动脚本统一读取本文件。
#
# API key 不写进本文件，从 .env 或环境变量读取（key_env 指示对应的 env var）。
# 所有模型共用同一个 sufy key：SUFY_API_KEY（endpoint openai.sufy.com/v1）。
#
# ── 两层容错结构（2026-07-08）──────────────────────────────────────────
# 每个角色配一个 providers 列表 = 两层循环容错的候选池：
#   外层：providers（厂商）——第一个厂商全挂才切下一个厂商
#   内层：每个 provider 的 models（同厂商模型）——某模型 502/401/超时→切同厂商下一个
# FailoverChatClient 发现某模型不可用时自动顺延，并记住首个可用的当默认
# （current provider/model 存内存；传 state_path 可落盘，跨并发短命进程复用）。
# 抗坍缩轮换（questioner 的 rotate_every）与容错正交：在**可用**模型间主动轮换。
#
# 向后兼容：旧的 observer.api_base / questioner.rotation 结构仍可解析。

observer:
  temperature: 0.0                   # 客观取证，确定性
  providers:
    - name: sufy
      api_base: "https://openai.sufy.com/v1"
      key_env: "SUFY_API_KEY"
      models:
        - "openai/gpt-5.4-mini"      # 轻量取证角色，采集量最大→选省的
        - "openai/gpt-5-mini"        # 同厂商备用

questioner:
  temperature: 0.9                   # 抗坍缩
  rotate_every: 5                    # 每 5 次提问主动轮换（在可用模型间）
  providers:
    - name: sufy                     # 主厂商：4 个跨风格模型
      api_base: "https://openai.sufy.com/v1"
      key_env: "SUFY_API_KEY"
      # 顺序 = failover 优先级。可靠的非 thinking 模型在前（sonnet / qwen3-max，
      # 极少截断）；thinking 模型（deepseek-v4-pro / kimi-k2.6）排后——它们把
      # max_tokens 大量花在隐藏推理上，512 时频繁 TruncatedOutputError（见
      # 2026-07-09/10 smoke）。questioner max_tokens 已提到 1024 给它们留内容
      # 余量；rotate_every 仍在**可用**模型间轮换以抗坍缩。
      models:
        - "claude-4.6-sonnet"
        - "qwen3-max"                # was qwen/qwen3.7-max (persistent 502 on sufy 2026-07-08)
        - "deepseek/deepseek-v4-pro"
        - "moonshotai/kimi-k2.6"

reward:
  temperature: 0.0                   # 冻结 reward，一致性
  providers:
    - name: sufy
      api_base: "https://openai.sufy.com/v1"
      key_env: "SUFY_API_KEY"
      models:
        - "anthropic/claude-4.8-opus"
        - "anthropic/claude-4.6-sonnet"  # 同厂商备用
