# Static hermes config, referenced from agent_loop_config.yaml via
# harness.settings.config_path. The HermesHarness merges only its
# context-derived dynamic block on top at runtime:
#   model.base_url, model.context_length, model.max_tokens
#   auxiliary.compression.base_url
#   delegation.base_url
# so you do not (and should not) set those fields here.
#
# Plugin secrets are configured in sandbox config.yaml
# and overridable via ~/.hermes/.env for CI deployments.

model:
  default: custom/model
  provider: custom
  api_key: EMPTY
  api_mode: chat_completions

providers:
  custom:
    api_key: EMPTY
    model: custom/model

auxiliary:
  compression:
    provider: custom
    model: custom/model
    api_key: EMPTY
  vision:
    provider: custom
    model: custom/model
    api_key: EMPTY

delegation:
  model: custom/model
  api_key: EMPTY
  api_mode: chat_completions

# web 工具:Serper(Google 搜索) + Jina(URL 抓取) 包成 hermes web provider 插件
# (docker/sandbox/hermes_plugins/web/serper),让模型直接 call web_search / web_extract。
# 之前只把 serper_search.py/jina_read.py 当裸脚本放 /opt/tools,web_search 无 backend →
# 模型一调就 undefined(评测日志 web_search 37 次全 undefined,2026-08-27)。现启用插件 +
# 路由 backend=serper。key 由 harness.env 注入沙箱 ~/.hermes/.env(SERPER/JINA)。
plugins:
  enabled: [web-serper]

web:
  search_backend: serper     # web_search → SerperWebProvider.search (google.serper.dev)
  extract_backend: serper    # web_extract → SerperWebProvider.extract (r.jina.ai)

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  hygiene_hard_message_limit: 400
  protect_first_n: 3
  abort_on_summary_failure: false

security:
  redact_secrets: false

platform_toolsets:
  cli:
    - clarify
    - code_execution
    - delegation
    - file
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web

skills:
  external_dirs: ["~/.hermes/skills"]
  template_vars: true
  inline_shell: false
  inline_shell_timeout: 10
  guard_agent_created: false
  creation_nudge_interval: 0
  disabled: []
