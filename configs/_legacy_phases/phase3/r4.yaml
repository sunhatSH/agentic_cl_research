# Phase 3 / R4 — BucketDesign 完整版 (两级采样 + 抗遗忘 priority)
# 继承 configs/base.yaml
# 对照轴：是否使用 priority (R3 → R4), priority 类型 (R4 → R5)

defaults:
  - ../../base

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0

cl:
  lambda_replay: 0.5
  buffer:
    enabled: true
    num_buckets: 9
  weighting:
    scheme: W0                   # 无 U 形（token 级均匀）；priority 仍按轨迹缩放 + 用于采样。
                                 # 与 R4-w(W2) 的唯一差异 = 是否启用 U 形块权重
