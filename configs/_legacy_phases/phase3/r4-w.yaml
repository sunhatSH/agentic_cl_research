# Phase 3 / R4-w — Reweighted Replay 主方案 (priority × U 形块权重 + clip)
# 继承 configs/base.yaml
# 对照轴：priority 用法 (R4 → R4-w), W0 vs W2

defaults:
  - ../../base

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0

cl:
  lambda_replay: 0.5
  buffer:
    enabled: true
    num_buckets: 9
  weighting:
    scheme: W2                   # 主方案：priority × U 形块权重 + clip
    gamma: 0.88
    delta: 0.88
    segmenter: message_block     # 按 OpenAI chat message 边界切块（无 XML tag）
    role_boundaries: [assistant, tool]
    equal_length_K: 20           # fallback：K_i==1 时退化为等长切分
    long_block_threshold: 100
    clip_quantiles: [0.05, 0.95]
