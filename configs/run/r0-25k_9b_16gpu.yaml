# Phase 3 / R0-25K — CLEAR baseline 25k
# 9B 16GPU（2节点×8卡）可运行配置，继承 b1_9b_16gpu 硬件规格。
#
# 启动: bash scripts/train.sh 16gpu --config configs/run/r0-25k_9b_16gpu.yaml

defaults:
  - ../_generated_ppo_trainer
  - ../base

# ── 模型（Qwen3.5-9B）──────────────────────────────────────────────────────────
actor_rollout_ref:
  model:
    path: /mnt/afs_toolcall/sunhao4/models/Qwen3.5-9B
    use_fused_kernels: false
    override_config:
      attn_implementation: sdpa

  # ── 训练引擎（16 GPU FSDP, micro=2）─────────────────────────────────────────
  actor:
    strategy: fsdp
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.001
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 2
    ppo_max_token_len_per_gpu: 65536
    ulysses_sequence_parallel_size: 2
    fsdp_config:
      param_offload: true
      optimizer_offload: true

  # ── rollout：沙箱 Hermes（lightllm 后端，TP2）────────────────────────────────
  rollout:
    name: lightllm
    mode: async
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.40
    n: 8
    load_format: auto
    max_model_len: 65536
    max_num_batched_tokens: 8192
    enable_chunked_prefill: false
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    agent:
      agent_loop_manager_class: trainer.cl_rollout_manager.AgentLoopManager
    multi_turn:
      enable: false
      format: qwen3_coder
      reasoning_format: qwen3
      max_assistant_turns: 20
    checkpoint_engine:
      update_weights_bucket_megabytes: 2048
    engine_kwargs:
      lightllm:
        batch_max_tokens: 8192
        enable_multimodal: false
        enable_torch_memory_saver: true
        graph_max_batch_size: 64
        running_max_req_size: 64
        sampling_backend: triton
        disable_vision: true
        disable_audio: true

  ref:
    path: /mnt/afs_toolcall/sunhao4/models/Qwen3.5-9B  # pi_0 初始模型
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

reward:
  reward_model:
    enable: false
    rollout:
      name: vllm

# ── 数据 ──────────────────────────────────────────────────────────────────────
data:
  train_files: /mnt/afs_toolcall/sunhao4/workspace/agentic_cl_research/datasets/train.parquet
  val_files: /mnt/afs_toolcall/sunhao4/workspace/agentic_cl_research/datasets/val.parquet
  train_batch_size: 64
  gen_batch_size: 64
  max_prompt_length: 2048
  max_response_length: 53886
  shuffle: false
  return_raw_chat: true
  filter_overlong_prompts: true
  trust_remote_code: true
  dataloader_num_workers: 4
  cache_dir: /tmp/verl_rlhf_cache

# ── CL 参数 ──────────────────────────────────────────────────────────────────
cl:
  lambda_replay: 0.5
  replay_batch_size: 512
  buffer:
    enabled: true
    num_buckets: 1
    total_capacity: 25000
    eviction_type: reservoir
    within_bucket_sampling: uniform
    priority_type: uniform
  weighting:
    scheme: W2
    gamma: 1.0
    delta: 1.0
# ── trainer ──────────────────────────────────────────────────────────────────
trainer:
  nnodes: 2
  n_gpus_per_node: 8
  total_epochs: 1
  total_training_steps: 500
  save_freq: 100
  test_freq: 100
  critic_warmup: 0
  logger: [console]
  log_val_generations: 50
  project_name: agentic-cl
  experiment_name: qwen35_9b_r0-25k_16gpu
  default_local_dir: ${oc.env:CKPT_DIR,ckpts/qwen35_9b_r0-25k_16gpu}

ray_kwargs:
  ray_init:
    address: auto
    num_cpus: null
