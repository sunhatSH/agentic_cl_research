# Phase 1 / B1 — 9B 单机 8GPU 可运行配置（Qwen3.5-9B）。
# = verl 引擎默认 + base overlay + B1 语义（无 KL、无 replay）+ lightllm 引擎。
# B1：纯 RL 遗忘基线，量化灾难性遗忘程度（遗忘下界）。
#
# 与 production_27b 共享 base.yaml 的算法默认值（train_batch=256, W0 flat weighting），
# 仅在模型/硬件/并行度上分叉到 9B + 8 GPU。
#
# 启动: bash scripts/train.sh configs/run/b1_8b.yaml
#   (train.sh 自动 source load_training_env.sh；reward judge 走 sufy claude-4.8-opus)

defaults:
  - ../_generated_ppo_trainer
  - ../base

# ── 模型（Qwen3.5-9B）──────────────────────────────────────────────────────────
actor_rollout_ref:
  model:
    path: /mnt/afs_toolcall/sunhao4/models/Qwen3.5-9B
    use_fused_kernels: false
    override_config:
      attn_implementation: sdpa   # avoid flash_attn dep (not installed)

  # ── 训练引擎（8 GPU FSDP, micro_batch=4）────────────────────────────────────
  actor:
    strategy: fsdp
    use_kl_loss: false           # B1：无 KL
    kl_loss_coef: 0.0
    entropy_coeff: 0.001        # lambda_4, FIXED (anti Echo Trap)
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
    ppo_max_token_len_per_gpu: 32768
    ulysses_sequence_parallel_size: 1   # 8卡不用SP
    fsdp_config:
      param_offload: false
      optimizer_offload: false

  # ── 推理（lightllm async, 2×TP4）────────────────────────────────────────────
  rollout:
    name: lightllm
    mode: async
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.75
    n: 8                         # GRPO group size (traj/query)
    load_format: auto            # 加载真权重（非 dummy 随机权重）
    max_model_len: 32768
    max_num_batched_tokens: 8192
    enable_chunked_prefill: false
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 4
    # 多轮 / 推理格式（Qwen3 设置）
    multi_turn:
      enable: false
      format: qwen3_coder
      reasoning_format: qwen3
      max_assistant_turns: 20
    checkpoint_engine:
      update_weights_bucket_megabytes: 2048
    # lightllm 引擎参数
    engine_kwargs:
      lightllm:
        batch_max_tokens: 8192
        enable_multimodal: false     # Qwen3.5-9B 纯文本用 disable_vision/audio
        enable_torch_memory_saver: true
        graph_max_batch_size: 64
        running_max_req_size: 64
        sampling_backend: triton
        disable_vision: true
        disable_audio: true

  ref:
    path: /mnt/afs_toolcall/sunhao4/models/Qwen3.5-9B
    log_prob_micro_batch_size_per_gpu: 4
    fsdp_config:
      param_offload: false

# verl reward_model worker 不启用（judge 走外部 sufy 服务）
reward:
  reward_model:
    enable: false
    rollout:
      name: vllm

# ── 数据：能力桶打标产物 ──────────────────────────────────────────────────────
data:
  train_files: /mnt/afs_toolcall/sunhao4/workspace/agentic_cl_research/datasets/train_aligned.parquet
  val_files: /mnt/afs_toolcall/sunhao4/workspace/agentic_cl_research/datasets/val.parquet
  train_batch_size: 256
  gen_batch_size: 256
  max_prompt_length: 4096
  max_response_length: 8192
  return_raw_chat: true
  filter_overlong_prompts: true
  trust_remote_code: true
  dataloader_num_workers: 4
  cache_dir: /tmp/verl_rlhf_cache

# ── B1 语义（无 KL、无 replay）────────────────────────────────────────────────
cl:
  lambda_replay: 0.0
  buffer:
    enabled: false

# ── trainer：8 GPU 单机 ───────────────────────────────────────────────────────
trainer:
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 1
  total_training_steps: 50
  save_freq: 5
  test_freq: 25
  critic_warmup: 0
  logger: console
  log_val_generations: 50
  project_name: agentic-cl
  experiment_name: qwen35_9b_b1
  default_local_dir: ${oc.env:CKPT_DIR,ckpts/qwen35_9b_b1}

# ── Ray：单机本地集群 ─────────────────────────────────────────────────────────
ray_kwargs:
  ray_init:
    address: local
    num_cpus: null
