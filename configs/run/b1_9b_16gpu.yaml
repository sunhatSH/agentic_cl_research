# 16 卡 9B 训练配置（2 节点 × 8 卡）——verl 原生 agent_loop 路线（2026-07-29 迁移）。
# 从自写 rollout(cl_rollout_manager)迁到 recipe_custom 原生 agent_loop(RayPPOTrainerV1)。
# 关键:Qwen3.5-9B 混合 GDN 结构【能】用 use_remove_padding+flash_attn3(verl 已实现 GDN 变长
# packed forward,靠 VERL_USE_EXTERNAL_MODULES=recipe_custom.bootstrap + model_type=
# custom_language_model),不再退回 sdpa/短序列。参考 debug_rl_qwen35_9b.sh(同为9B,已验证)。
# 长度照搬参考(与卡数无关);并发按 16 卡换算(用户决策):SP=4→DP=4,batch 32×n8=256轨迹/step。
#
# 启动：bash scripts/train.sh 16gpu --config configs/run/b1_9b_16gpu.yaml

defaults:
  - ../_generated_ppo_trainer
  - ../base

# ── 模型（Qwen3.5-9B，开 remove_padding + flash_attn3 变长打包）──────────────────
actor_rollout_ref:
  model:
    path: /mnt/afs_toolcall/sunhao4/models/Qwen3.5-9B
    use_remove_padding: true            # 变长打包:GDN 层走 packed forward(cu_seqlens),full-attn 走 FA3 varlen
    use_fused_kernels: true             # fused CE loss 等 kernel(配合 remove_padding)
    override_config:
      attn_implementation: flash_attention_3
      model_type: custom_language_model # → CustomFSDPEngineWithLMHead(recipe_custom,支持 GDN 变长+路由重放)

  # ── 训练引擎（16 GPU FSDP2, SP=4 → DP=4）─────────────────────────────────────
  actor:
    strategy: fsdp2                     # 参考脚本用 fsdp2(长序列131K内存管理更优);配 remove_padding
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.001
    use_torch_compile: false
    clip_ratio_low: 0.2                 # 参考脚本 PPO clip(信任域);logprob 已带回,clip 真正生效
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    optim:
      lr: 2.0e-6                        # 9B 峰值 lr(warmup 前3% step 0→2e-6,后 constant)
      lr_warmup_steps_ratio: 0.03
      lr_scheduler_type: constant
    ppo_mini_batch_size: 32             # =train_batch(全 batch 单次更新);内部 ×n8=256 轨迹 % DP4=0
    use_dynamic_bsz: true               # 变长打包:按实际 token 数切 micro(配 remove_padding)
    # ppo_max_token_len = max_token_length / SP = 131072 / 4 = 32768(参考脚本同法)。
    # remove_padding+变长下这是单卡 micro-batch 的 token 预算,激活按真实长度算。超长由 rollout 端
    # max_tool_response_length 截断,不会撞 assert(见 §28 教训,现由 verl 原生处理)。
    ppo_max_token_len_per_gpu: 32768
    ulysses_sequence_parallel_size: 4   # SP=4 → DP=16÷4=4。16头%4=0;单卡序列切4段降激活
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      reshard_after_forward: true
      model_dtype: bfloat16

  # ── rollout：recipe_custom 原生 agent_loop（lightllm 后端，TP2）─────────────────
  # 注:不再设 agent.agent_loop_manager_class —— RayPPOTrainerV1.init_workers 会强制设为
  # recipe_custom.agent_loop.rollout_manager.RolloutManager(原生 agent_loop)。自写的
  # trainer.cl_rollout_manager 不再使用(logprob/工具截断/契约由 verl 原生处理)。
  rollout:
    name: lightllm
    mode: async
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.75        # 照搬参考(remove_padding 训练省显存,rollout 可给 KV 池更多)
    n: 8
    load_format: auto
    max_model_len: 131072               # = max_token_length(prompt8196+response65536+余量)
    max_num_batched_tokens: 6144        # 照搬参考
    enable_chunked_prefill: false
    calculate_log_probs: true           # rollout 带回 logprob → old_log_prob(PPO clip/ppo_kl 生效)
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 32768  # = max_token_length/SP,同 actor
    response_length: 65536              # 单次生成上限(与 data.max_response_length 一致)
    multi_turn:
      format: qwen3_coder
      reasoning_format: qwen3
      max_assistant_turns: 8            # ReAct 多轮上限
      max_tool_response_length: 16384   # ★ 单次工具输出截断(治 §28 那个31万token:verl原生处理)
    checkpoint_engine:
      update_weights_bucket_megabytes: 3072
    engine_kwargs:
      lightllm:
        batch_max_tokens: 6144
        enable_multimodal: false
        enable_torch_memory_saver: true
        graph_max_batch_size: 256       # 配合 256 并发
        running_max_req_size: 256       # 推理端一次并发上限=256(=train_batch32×n8)
        sampling_backend: triton
        disable_vision: true
        disable_audio: true

  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

reward:
  reward_model:
    enable: false
    rollout:
      name: vllm

# ── 数据 ──────────────────────────────────────────────────────────────────────
# 单轮化:每 query 一条轨迹,按桶配额采样。baseline shuffle=false 按桶序训(可测遗忘)。
# 长度照搬参考脚本(与卡数无关):prompt 8196 / response 65536(remove_padding 变长打包能扛)。
data:
  train_files: /mnt/afs_toolcall/sunhao4/workspace/agentic_cl_research/datasets/train.parquet
  val_files: null
  train_batch_size: 32                # 32 query/step × n8 = 256 轨迹/step
  gen_batch_size: 32
  max_prompt_length: 8196
  max_response_length: 65536          # 整条 response 上限(变长打包,不再需三层截断硬扛)
  shuffle: false                     # 按文件序（桶序排列）训 → 可测遗忘
  return_raw_chat: true
  filter_overlong_prompts: true
  trust_remote_code: true
  dataloader_num_workers: 4
  cache_dir: /tmp/verl_rlhf_cache

# ── 算法：rollout/训练 policy 的 IS 修正(处理 old_log_prob≠rollout_log_prob)──────────
algorithm:
  adv_estimator: grpo
  rollout_correction:
    rollout_is: token                 # token 级 importance sampling 修正(参考脚本同)
    rollout_is_threshold: 2.0

# ── baseline 语义（无 KL、无 replay/buffer）──────────────────────────────────────
# 注:cl.rollout.sessions_per_step / max_single_gen_tokens 已删——那是自写 rollout
# (cl_rollout_manager)的参数,迁到原生 agent_loop 后不再读。并发由 rollout 段的
# running_max_req_size + train_batch×n 决定。CL loss/buffer 语义仍由 cl 段驱动。
cl:
  lambda_replay: 0.0
  replay_batch_size: 32           # 回放量(b1 buffer 关不生效;R 系列继承)。base 全局仍 64,只覆盖 b1。
  buffer:
    enabled: false

# ── trainer：16 GPU 2 节点 ────────────────────────────────────────────────────
trainer:
  nnodes: 2
  n_gpus_per_node: 8
  total_epochs: 1
  total_training_steps: 500
  save_freq: 100
  test_freq: -1                 # baseline 训完离线统一评测,关 verl 内建验证
  val_before_train: false       # 不训练前跑验证(918 query rollout 纯浪费+曾触发崩溃)
  critic_warmup: 0
  logger: [console, file]       # file=verl 原生 FileLogger,每 step 实时写 JSONL(buffering=0),
                                # 含 reward/advantage/loss 全套聚合 metrics。路径由 VERL_FILE_LOGGER_PATH
                                # 注入(_train_impl.sh)。取代此前坏掉的 _log_training_metrics(取不到完整metrics)。
  log_val_generations: 50
  project_name: agentic-cl
  experiment_name: qwen35_9b_b1_16gpu
  default_local_dir: ${oc.env:CKPT_DIR,ckpts/qwen35_9b_b1_16gpu}

ray_kwargs:
  ray_init:
    address: auto
    num_cpus: null
