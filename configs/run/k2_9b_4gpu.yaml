# K2 4 卡 debug 配置(单机×4)——以【已验证能跑的】b1_9b_4gpu 为模板,仅叠加 KL 防遗忘语义。
# 差异 = use_kl_loss:true + kl_loss_coef:0.05 + kl_loss_type:low_var_kl(K1/K2/K3 只此系数不同)。
# 用途:在 4 卡单机验证 K 系列(KL 对照组)链路,绕开 16 卡多节点起服 hang(见 doc/debug/16gpu_hang_handoff)。
# 架构/长度/缩放全部继承 b1_9b_4gpu(custom_sync + verl 原生 agent_loop + SP=2/DP=2)。
#
# 缩放(16卡→4卡 debug,size 1/8)：nnodes 2×8→1×4；SP 4→2(→DP=2)；
#   train_batch 32→4(÷8)；并发 256→32(÷8)。整除：4%SP2=0 ✓；train_batch4%DP2=0 ✓；
#   ppo_mini4%DP2=0 ✓；rollout TP2 → 2 replica。train_batch=4 × n8 = 32 轨迹/step(debug 够)。
#
# 启动：bash scripts/train.sh 4gpu --config configs/run/b1_9b_4gpu.yaml

defaults:
  - ../_generated_ppo_trainer
  - ../base

actor_rollout_ref:
  model:
    path: /mnt/afs_toolcall/sunhao4/models/Qwen3.5-9B
    model_type: custom_language_model   # ★ 必须放顶层(对齐参考脚本 +model.model_type=)。此键=引擎选择键:
                                       #   engine_workers.py:128 EngineRegistry.new(model_type=config.model_type)
                                       #   选中 CustomFSDPEngineWithLMHead(GDN 变长+路由重放);其 __init__ 再把
                                       #   hf_config.model_type 复位回 language_model,故 apply_monkey_patch 读到
                                       #   真实 qwen3_5 → 走 qwen3_5.py 的 SP-aware triton forward(labels 也 SP-slice)。
                                       #   ✗ 放进 override_config 会经 update_model_config 把 HF config.model_type
                                       #   改成 custom_language_model → monkey_patch 落到 dense_common 通用分支
                                       #   (不对 labels 做 ulysses_pad_and_slice)→ hidden(1/SP)与 labels(全长)行数
                                       #   不匹配 → linear_cross_entropy assert hidden.shape[0]==labels.shape[0] 崩。
    use_remove_padding: true
    use_fused_kernels: true             # ★ 开(对齐参考脚本 debug_rl_qwen35_9b.sh):非融合路径
                                       #   logits_rmpad.full_tensor() gather 到全长,但 temperature_rmpad
                                       #   被 SP 切成 1/SP → 相除 a=2×b 崩(transformer_impl.py:1259)。
                                       #   融合路径用 output.log_probs(SP-aware),绕开该 bug。
    enable_gradient_checkpointing: true # 对齐参考脚本,省激活显存
    fused_kernel_options:
      impl_backend: triton            # ★ torch backend 的 FusedLinearForPPO chunk_size=512 硬编码 bug
                                       #   (torch_functional.py:164 log_probs[chunk_start:chunk_end]=chunk_log_probs
                                       #   长度不匹配崩)。triton backend 走 linear_cross_entropy(不 chunk/不预分配),绕开。
    override_config:
      attn_implementation: flash_attention_3

  # ── 训练引擎（4 GPU FSDP2, SP=2 → DP=2）─────────────────────────────────────
  actor:
    strategy: fsdp2
    use_kl_loss: true                # K2:开 reverse-KL 防遗忘(对照 baseline 无KL)
    kl_loss_coef: 0.05
    kl_loss_type: low_var_kl
    entropy_coeff: 0.001
    use_torch_compile: false
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    optim:
      lr: 5.0e-6
      lr_warmup_steps_ratio: 0.03
      lr_scheduler_type: constant
    ppo_mini_batch_size: 4              # =train_batch(全 batch 单更);×n8=32 轨迹 % DP2=0
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 32768    # = max_token_length(131072)/SP(4)。SP升4后每卡token预算减半->backward激活减半(修 k3 update_actor OOM 1.63GB,ref占用更大)。32768xSP4=131072仍覆盖最长序列,不限长
    ulysses_sequence_parallel_size: 4   # SP=2->4(修训练侧 backward OOM,K比b1多个ref更吃紧):4卡全做序列并行->单卡激活/2。DP=4/4=1。16头%4=0;train_batch4%DP1=0
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      reshard_after_forward: true
      model_dtype: bfloat16

  # ── rollout：同 16 卡（RemoteAgentLoopManager + 沙箱 harness），并发缩到 1/8 ──────
  rollout:
    name: lightllm
    mode: async
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.65        # 0.75->0.65:降推理侧 KV 池,修 lightllm prefill OOM(k1/k2 撞上 24MiB 分配失败=KV榨干)
    n: 8
    load_format: auto
    max_model_len: 131072              # = 参考 max_token_length
                                       #   既覆盖 prompt4096+response12288,又减少 KV 池压力。
    max_num_batched_tokens: 6144
    enable_chunked_prefill: false       # ⚠️ 死键:lightllm 不读它(仅 vllm/trtllm 用),对 lightllm 无效。
                                        #   lightllm 实际 chunked 恒开,分段由 batch_max_tokens 管。见 §44/§45。
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 32768  # = max_token_length(131072)/SP(4)
    response_length: 65536             # = data.max_response_length
    agent:
      agent_loop_manager_class: recipe_custom.agent.agent_loop_manager.RemoteAgentLoopManager
      agent_loop_config_path: exps/agent_loop_config.yaml
      default_agent_loop: hermes_agent
    custom:
      remote_agent:
        gateway_count: 2               # 4卡小规模,gateway/worker 缩到 2(16卡是8)
        num_session_workers: 2
        session_timeout: 1000            # ★ 对齐参考脚本(900→1000):900 偏紧,曾触发 wall-clock timeout
        harness_log_dir: ${oc.env:HARNESS_LOG_DIR,logs/harness}
        harness_log_save_mode: all
        all_failed_policy: skip   # 整 step 全部 rollout 失败(如都因含图被废,见 gateway_image_drop_patch/§57)时 skip 该 step 而非 raise 崩训练。默认 raise。
    multi_turn:
      format: qwen3_coder
      reasoning_format: qwen3
      max_assistant_turns: 6             # ★ 对齐参考脚本(5→8):5 轮过短,ReAct 易被截断→轨迹质量差
      max_tool_response_length: 16384
    checkpoint_engine:
      update_weights_bucket_megabytes: 3072  # 照搬参考(6144→3072)
    engine_kwargs:
      lightllm:
        batch_max_tokens: 6144
        enable_multimodal: false         # ★ 对齐参考脚本(参考开 multimodal=false,但本项目纯文本,关)
        enable_torch_memory_saver: true
        graph_max_batch_size: 32        # 配合 32 并发(256→32)
        running_max_req_size: 32        # 推理端一次并发上限=32(=train_batch4×n8)
        sampling_backend: flashinfer       # 照搬参考(triton→flashinfer)
        disable_vision: true
        disable_audio: true

  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true

  # nccl_timeout 在 actor_rollout_ref 同级(不在 actor.fsdp_config 下,否则 FSDPActorConfig 报未知 kw)
  nccl_timeout: 1200                 # 多卡同步超时阈值:单机1200

reward:
  reward_manager:
    name: omni
  reward_model:
    enable: false
    rollout:
      name: vllm

# ── 数据（同 16 卡：CLAgentDataset fs-seed 注入；长度不缩）──────────────────────
data:
  train_files: /mnt/afs_toolcall/sunhao4/workspace/agentic_cl_research/datasets/train.parquet
  val_files: null
  custom_cls:
    path: /mnt/afs_toolcall/sunhao4/workspace/agentic_cl_research/trainer/cl_agent_dataset.py
    name: CLAgentDataset
  train_batch_size: 4                 # 4 query/step × n8 = 32 轨迹/step（16卡32→4,÷8）
  gen_batch_size: 4
  max_prompt_length: 8196            # 照搬参考 debug_rl_qwen35_9b.sh(wuzehuan)
  max_response_length: 65536         # 照搬参考(与卡数无关);remove_padding 变长打包可扛,§31 修复后原崩溃真因(model_type)已消除
                                       #   累积 total_nnz 过大,触发 SP 切片后 a=2×b 不匹配。缩到 12288
                                       #   既覆盖正常轨迹,又避开超长 packed 序列的 SP bug。
  shuffle: false
  return_raw_chat: true
  filter_overlong_prompts: true
  trust_remote_code: true
  dataloader_num_workers: 4
  cache_dir: /tmp/verl_rlhf_cache

algorithm:
  adv_estimator: grpo
  rollout_correction:
    rollout_is: token                 # ★ 加回(对齐参考脚本):token 级 IS 修正
    rollout_is_threshold: 2.0
    rollout_rs: null
    rollout_rs_threshold: null
    bypass_mode: false

cl:
  lambda_replay: 0.0
  replay_batch_size: 4
  buffer:
    enabled: false

# ── trainer：4 GPU 单机 ────────────────────────────────────────────────────────
trainer:
  nnodes: 1
  n_gpus_per_node: 4
  total_epochs: 1
  total_training_steps: 500
  save_freq: 25                     # 100->25:更频繁存档(debug 阶段)
  max_actor_ckpt_to_keep: 2       # 只保留最近 2 个 actor ckpt(verl 原生 rotate,超出 shutil.rmtree 最旧)
  max_critic_ckpt_to_keep: 2      # critic 同理(本项目 GRPO 无 critic,留着无害)
  test_freq: -1
  val_before_train: false
  critic_warmup: 0
  logger: [console, file]
  log_val_generations: 50
  project_name: agentic-cl
  experiment_name: qwen35_9b_k2_4gpu
  default_local_dir: ${oc.env:CKPT_DIR,ckpts/qwen35_9b_k2_4gpu}
  use_v1: true
  v1:
    trainer_mode: custom_sync
    sampler:
      custom_sampler:
        path: null
        name: null

transfer_queue:
  enable: true

# ray_kwargs 不设 address(单机 Ray 本地起;16 卡多机才设 address:auto)
ray_kwargs:
  ray_init:
    num_cpus: null
