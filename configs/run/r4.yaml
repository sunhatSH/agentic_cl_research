# R4 集群 runnable 配置 = verl 引擎默认 + base overlay + cluster 引擎层 + R4 语义。
# R4：BucketDesign 完整版（9 桶 + 抗遗忘 priority，W0 token 均匀）。
# 启动：bash scripts/run_phases.sh configs/run/r4.yaml

defaults:
  - ../_generated_ppo_trainer
  - ../base
  - ../cluster

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.001

cl:
  lambda_replay: 0.5
  buffer:
    enabled: true
    num_buckets: 9
  weighting:
    scheme: W0

trainer:
  experiment_name: qwen36_27b_r4
