# B1 集群 runnable 配置 = verl 引擎默认 + base overlay + cluster 引擎层 + B1 语义。
# B1：纯 RL 遗忘基线（无 KL、无 replay）。
# 方法学：B1 与 R4 走【同一套】agentic 多轮 rollout（继承 cluster.yaml 的
# CLSchedulerAgentLoopManager + 16×8 winner-sync + ReAct 沙箱多轮），差异仅在
# CL 项（B1 关 replay / 无 KL）。否则拿"多轮执行完成"的 R4 和"单轮"的 B1
# 比遗忘是不公平的——遗忘基线必须在同等 rollout 下测。
# 启动：bash scripts/run_phases.sh   或   bash scripts/run_phases.sh configs/run/b1.yaml

defaults:
  - ../_generated_ppo_trainer
  - ../base
  - ../cluster

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.001

cl:
  lambda_replay: 0.0
  buffer:
    enabled: false

trainer:
  experiment_name: qwen36_27b_b1
