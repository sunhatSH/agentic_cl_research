# Phase 0 / P0-E — 冷启动数据来源消融：偏 gpt-5 ("质量为主"假设, 30:70)
# 见 doc/Plan_冷启动数据来源消融.md
# 本臂 buffer 由: warmup_buffer.py --ratio-27b 0.3 生成。
defaults:
  - ../base

actor_rollout_ref:
  actor:
    use_kl_loss: false
    kl_loss_coef: 0.0

cl:
  lambda_replay: 0.5
  buffer:
    enabled: true
    num_buckets: 9
    warmup_path: data/mock/buffer_dumps/p0-e_mix3070.sqlite   # 30% 27B : 70% gpt5
  weighting:
    scheme: W0

trainer:
  experiment_name: p0-e-src-mix3070
  total_training_steps: 30
