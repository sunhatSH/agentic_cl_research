# Phase 1 / B1 — 4-GPU 1-step SMOKE (验证 FSDP + vllm rollout 完整循环跑通)
#
# 不是正式实验配置。目标：4 卡跑 1 step 不报错。与 b1.yaml 同语义（纯 RL，
# 无 KL、无 replay），但补齐了 cl_main 不会自动加载的 verl 引擎字段，并把
# 规模压到最小。
#
# cl_main.load_config 按 defaults 顺序 merge：先 verl 完整展开配置（提供 fsdp/
# optim/rollout 引擎全字段），再叠加我们的 ../base overlay，最后本文件覆盖。
#
# reward judge 用本地 mock（scripts/mock_judge.py，固定满分）——启动前需:
#   export JUDGE_API_BASE=http://127.0.0.1:8100/v1 JUDGE_MODEL=mock-judge
#
# 启动: bash scripts/phase1/run_smoke.sh   (或直接 python -m trainer.cl_main --config 本文件)

defaults:
  - /mnt/afs_toolcall/sunhao4/verl/verl/trainer/config/_generated_ppo_trainer.yaml
  - ../base

# ---- B1 语义（与 b1.yaml 一致）-------------------------------------------------
algorithm:
  adv_estimator: grpo            # GRPO：无需 critic worker（省一份显存，4 卡更可行）

# verl reward_model worker 不启用（judge 走外部 mock）。base.yaml 把它嵌在
# reward.reward_model 下，其 rollout.name 仍是 ??? ；显式填合法值避免构造期
# MissingMandatoryValue。
reward:
  reward_model:
    enable: false
    rollout:
      name: vllm

cl:
  lambda_replay: 0.0
  buffer:
    enabled: false

# ---- 模型 / 参考策略（覆盖 base.yaml 的 ???）----------------------------------
actor_rollout_ref:
  model:
    path: /mnt/afs_toolcall/sunhao4/models/Qwen3.6-27B
  ref:
    path: /mnt/afs_toolcall/sunhao4/models/Qwen3.6-27B
    fsdp_config:
      param_offload: true

  actor:
    strategy: fsdp
    use_kl_loss: false           # B1：无 KL
    kl_loss_coef: 0.0
    entropy_coeff: 0.001
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 4       # 必须 <= train_batch_size
    ppo_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true        # 27B 在 4 卡上 offload 省显存
      optimizer_offload: true

  rollout:
    name: vllm                   # verl 默认是 None，必须显式指定
    mode: sync                   # smoke 用 sync（避开 async server 复杂度）
    tensor_model_parallel_size: 4  # 4 卡全给 vllm rollout 的 TP
    gpu_memory_utilization: 0.45   # 与 FSDP actor colocate，留余量
    load_format: auto            # 加载真权重（dummy=随机权重）
    max_model_len: 2048
    max_num_seqs: 8
    n: 2                         # GRPO 组大小（base 是 8，smoke 压到 2）
    log_prob_micro_batch_size_per_gpu: 1  # rollout log_prob 重算 micro-batch（verl 必填）
    # gdn triton fix：绕过 Qwen3.6 GDN FlashInfer 死锁（同任务1）
    engine_kwargs:
      vllm:
        additional_config:
          gdn_prefill_backend: triton

# ---- 数据（覆盖 base.yaml 的 ???，用最小 parquet）----------------------------
data:
  train_files: /mnt/afs_toolcall/sunhao4/agentic_cl_research/data/mock/datasets/train.parquet
  val_files: /mnt/afs_toolcall/sunhao4/agentic_cl_research/data/mock/datasets/train.parquet
  train_batch_size: 4
  gen_batch_size: 4
  max_prompt_length: 1024
  max_response_length: 512
  return_raw_chat: true          # convert_dataset 产出的 prompt 是 raw chat list
  dataloader_num_workers: 1
  cache_dir: /tmp/verl_rlhf_cache

# ---- trainer：1 step、不存 ckpt、不跑 val、不用 wandb ------------------------
trainer:
  nnodes: 1
  n_gpus_per_node: 4
  total_epochs: 1
  total_training_steps: 1        # 只跑 1 step
  save_freq: -1                  # 不存 checkpoint
  test_freq: -1                  # 不跑 val
  val_before_train: false        # 跳过训练前 val（也需 judge/rollout）
  logger: ['console']            # 不用 wandb
  critic_warmup: 0
  project_name: cl_smoke
  experiment_name: smoke_1step_b1

# ---- Ray：强制本机新起 local 集群，不去探测/连接残留的旧集群 -----------------
# 不传 address 时 ray.init() 会读 /tmp/ray/ray_current_cluster 自动连旧集群；
# 该文件可能是别的节点遗留的死地址（本次踩坑：连 10.120.1.56:6379 GCS timeout）。
# address=local 强制本地全新起 Ray，单机 smoke 正确做法。
ray_kwargs:
  ray_init:
    address: local
    num_cpus: null
