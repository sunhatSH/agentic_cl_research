[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cl-research"
version = "0.1.0"
description = "Continual Learning over Agentic LLM with Replay Buffer + verl"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sun Hao" }]
license = { text = "Apache-2.0" }

# Dependencies are placeholders -- pin exact versions after the first
# successful verl integration smoke test (see doc/VerlIntegration.md section 4.2).
dependencies = [
    "verl",
    "torch>=2.1",
    "transformers>=4.40",
    "ray>=2.10",
    "omegaconf>=2.3",
    "tensordict",
    "numpy",
    "pyyaml",
    "tqdm",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["replay_buffer*", "trainer*", "eval*"]
exclude = ["tests*", "doc*", "configs*", "scripts*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
